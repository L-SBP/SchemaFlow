version: '3.8'
services:
  # 1. PostgreSQL (系统元数据 - 存储用户归属关系、日志等)
  postgres-meta:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: auto_db_deployment
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_2025
    command: >
      postgres -c listen_addresses='*'
      -c max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - app-network

  # 2. MySQL (用户业务资源池 - 动态创建库的地方)
  mysql-user:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"  # 开发环境必需，生产环境建议仅暴露给内网或限制IP
    environment:
      # 【关键】这是你的后端用来创建新库的“上帝账号”
      MYSQL_ROOT_PASSWORD: root_secure_2025
      # 下面这些只是默认创建的一个空库，实际业务中可能用不到，但留着也可以用于健康检查
      MYSQL_DATABASE: default_check_db
      MYSQL_USER: check_user
      MYSQL_PASSWORD: check_password
      MYSQL_DEFAULT_AUTHENTICATION_PLUGIN: mysql_native_password
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --bind-address=0.0.0.0
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # 3. Redis
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --bind 0.0.0.0
      --requirepass secure_redis_2025
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network


