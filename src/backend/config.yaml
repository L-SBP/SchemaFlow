env: dev

# 本地开发环境
dev:
  # 应用配置
  app:
    # 应用名称
    name: Auto Database Deployment
    # 应用描述
    description: 自然语言创建、操作数据库
    # 应用接口
    api: /api/v1
    # 应用主机地址
    host: 0.0.0.0
    # 应用端口
    port: 8000
    # uvicorn应用入口
    uvicorn: server:my_app
    # 应用版本
    version: 1.0.0
    # 是否自动重载
    reload: true

  # 业务数据库配置(PostgresSQL)
  db:
    # 数据库主机
    host: localhost
    # 数据库端口
    port: 5432
    # 数据库名称
    database: auto_db_deployment
    # 数据库用户
    username: admin
    # 数据库密码
    password: secure_2025
    # 数据库连接驱动
    driver: postgresql+asyncpg
    # 是否开启sqlalchemy日志
    echo: true
    # sqlalchemy连接池配置
    max_overflow: 10
    # sqlalchemy连接池大小
    pool_size: 50
    # sqlalchemy连接池回收时间
    pool_recycle: 3600
    # sqlalchemy连接池空闲时间
    pool_timeout: 30

  # Redis配置
  redis:
    # Redis主机地址
    host: localhost
    # Redis端口
    port: 6379
    # Redis数据库索引
    db: 0
    # Redis密码
    password: "secure_redis_2025"

  log:
    # 文件日志级别
    file_level: DEBUG
    # 控制台日志级别
    console_level: INFO
    # 日志保留时间
    retention: 10 days
    # 日志轮转
    rotation: 500 MB

  jwt:
    # JWT密钥
    secret_key: "dev_secret_key"
    # JWT算法
    algorithm: HS256
    # JWT访问令牌有效期
    expire_time: 10080  # 60 * 24 * 7 minutes

  smtp:
    # SMTP服务器
    host: smtp.qq.com
    # SMTP端口
    port: 465
    # 发送者名称
    sender_name: "auto_db_deployment"
    # 发送者邮箱
    sender: 2803234009@qq.com
    # 授权码
    key: "bfujmrhgwroudhei"
    # 验证码有效期
    expire_time_seconds: 300


# 生产环境
prod:
  app:
    name: Auto Database Deployment
    description: 自然语言创建、操作数据库
    api: /api/v1
    host: 0.0.0.0
    port: 8000
    uvicorn: app.server:app
    version: 1.0.0
    reload: true

  db:
    host: localhost
    port: 5432
    database: auto_db_deployment
    username: admin
    password: secure_2025
    driver: postgresql+asyncpg
    echo: true
    max_overflow: 10
    pool_size: 50
    pool_recycle: 3600
    pool_timeout: 30

  redis:
    host: localhost
    port: 6379
    db: 0
    password: "secure_redis_2025"

  log:
    file_level: DEBUG
    console_level: WARN
    retention: 7 days
    rotation: 1 GB

  jwt:
    secret_key: "prod_secret_key" # 占位，后面会生成强密钥
    algorithm: HS256
    expire_time: 1440  # 60 * 24 minutes

  smtp:
    host: smtp.qq.com
    port: 465
    sender_name: "auto_db_deployment"
    sender: 2803234009@qq.com
    key: "bfujmrhgwroudhei"
    expire_time_seconds: 300