  smtp:
    host: smtp.qq.com
    port: 465
    sender_name: "auto_db_deployment"
    sender: 2803234009@qq.com
    key: "bfujmrhgwroudhei"
    expire_time_seconds: 300

  mysql:
    host: localhost
    port: 3306
    username: root
    password: root_secure_2025
    ssl: false
    plugin: mysql_native_password
