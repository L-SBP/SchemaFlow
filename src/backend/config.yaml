env: dev

# 本地开发环境
dev:
  # 应用配置
  app:
    # 应用名称
    name: Auto Database Deployment
    # 应用描述
    description: 自然语言创建、操作数据库
    # 应用接口
    api: /api/v1
    # 应用主机地址
    host: 0.0.0.0
    # 应用端口
    port: 8000
    # uvicorn应用入口
    uvicorn: server:my_app
    # 应用版本
    version: 1.0.0
    # 是否自动重载
    reload: true
  #新增ai配置
  ai:
    modelscope_api_key: "ms-5990c475-35aa-444d-80eb-01c7f0d5719b"

  # 业务数据库配置(PostgresSQL)
  db:
    # 数据库主机
    host: localhost
    # 数据库端口
    port: 5432
    # 数据库名称
    database: auto_db_deployment
    # 数据库用户
    username: admin
    # 数据库密码
    password: secure_2025
    # 数据库连接驱动
    driver: postgresql+asyncpg
    # 是否开启sqlalchemy日志
    echo: true
    # sqlalchemy连接池配置
    max_overflow: 10
    # sqlalchemy连接池大小
    pool_size: 50
    # sqlalchemy连接池回收时间
    pool_recycle: 3600
    # sqlalchemy连接池空闲时间
    pool_timeout: 30

  # Redis配置
  redis:
    # Redis主机地址
    host: localhost
    # Redis端口
    port: 6379
    # Redis数据库索引
    db: 0
    # Redis订阅频道
    subscribe_channel: "__keyevent@*:expired"

  log:
    # 文件日志级别
    file_level: DEBUG
    # 控制台日志级别
    console_level: INFO
    # 日志保留时间
    retention: 10 days
    # 日志轮转
    rotation: 500 MB

  jwt:
    # JWT密钥
    secret_key: "dev_secret_key"
    # JWT算法
    algorithm: HS256
    # JWT访问令牌有效期
    token_expire_time_seconds: 10800  # 60 * 24 * 7 minutes

  smtp:
    # SMTP服务器
    host: smtp.qq.com
    # SMTP端口
    port: 465
    # 发送者名称
    sender_name: "auto_db_deployment"
    # 发送者邮箱
    sender: 2803234009@qq.com
    # 授权码
    key: "bfujmrhgwroudhei"
    # 验证码有效期
    expire_time_seconds: 60

  mysql:
    # 数据库主机
    host: localhost
    # 数据库端口
    port: 3306
    # 用户名
    username: root
    # 密码
    password: 265515Wlr
    # SSL
    ssl: false
    # plugin
    plugin: sha256_password
    # 数据库连接驱动
    driver: mysql+aiomysql
    # sqlalchemy连接池配置
    max_overflow: 5
    # sqlalchemy连接池大小
    pool_size: 5
    # sqlalchemy连接池回收时间
    pool_recycle: 3600
    # sqlalchemy连接池空闲时间
    pool_timeout: 30

  # SQL权限
  sql_permissions:
    # MySQL Root 用户权限
    root:
      # 允许的操作（关键字，支持通配符 * 匹配后缀）
      allowed_operations:
        - "CREATE DATABASE *"
        - "DROP DATABASE *"
        - "CREATE USER *"
        - "DROP USER *"
        - "GRANT *"
        - "REVOKE *"
        - "CREATE TABLE *"
        - "ALTER TABLE *"
        - "DROP TABLE *"
        - "TRUNCATE TABLE *"
        - "SELECT *"
        - "INSERT *"
        - "UPDATE *"
        - "DELETE *"
        - "CREATE INDEX *"
        - "DROP INDEX *"
        - "USE *"
      # 禁止的操作（Root 仅禁止系统级高危操作）
      forbidden_operations:
        - "SET GLOBAL *"
        - "KILL *"
        - "SHOW PROCESSLIST"
    # MySQL 普通业务用户权限（仅 Project 内 DML 操作）
    normal:
      # 允许的操作（仅增删改查+切换自身库）
      allowed_operations:
        - "SELECT *"
        - "INSERT *"
        - "UPDATE *"
        - "DELETE *"
      # 禁止的操作（所有管理型/结构修改操作）
      forbidden_operations:
        - "USE *"
        - "CREATE DATABASE *"
        - "DROP DATABASE *"
        - "CREATE USER *"
        - "DROP USER *"
        - "GRANT *"
        - "REVOKE *"
        - "CREATE TABLE *"
        - "ALTER TABLE *"
        - "DROP TABLE *"
        - "TRUNCATE TABLE *"
        - "CREATE INDEX *"
        - "DROP INDEX *"
        - "SET *"
        - "KILL *"
        - "SHOW *"

# 生产环境
