<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#147aff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001eb3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cloud Shape Background (Darker) -->
  <path d="M 50 140 A 30 30 0 0 1 50 80 A 40 40 0 0 1 90 50 A 40 40 0 0 1 150 80 A 30 30 0 0 1 150 140 Z" fill="#001eb3" opacity="0.15" stroke="#147aff" stroke-width="2" />
  
  <!-- Database Stack inside -->
  <g transform="translate(70, 85)">
    <path d="M0 10 C0 0 50 0 50 10 V 25 C50 35 0 35 0 25 Z" fill="url(#cloudGrad)" />
    <path d="M0 30 C0 20 50 20 50 30 V 45 C50 55 0 55 0 45 Z" fill="url(#cloudGrad)" opacity="0.8" />
    <path d="M0 50 C0 40 50 40 50 50 V 65 C50 75 0 75 0 65 Z" fill="url(#cloudGrad)" opacity="0.6" />
    
    <!-- Top disk surface highlight -->
    <ellipse cx="25" cy="10" rx="25" ry="5" fill="white" opacity="0.3" />
  </g>
  
  <!-- Neural Network Element (Replacing Chip) -->
  <g transform="translate(135, 55)">
    <!-- Neural Nodes -->
    <circle cx="0" cy="10" r="4" fill="#c72b1a" />
    <circle cx="20" cy="0" r="4" fill="#c72b1a" opacity="0.8" />
    <circle cx="20" cy="20" r="4" fill="#c72b1a" opacity="0.8" />
    <circle cx="40" cy="10" r="4" fill="#c72b1a" />
    
    <!-- Connections -->
    <line x1="0" y1="10" x2="20" y2="0" stroke="#c72b1a" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="10" x2="20" y2="20" stroke="#c72b1a" stroke-width="1.5" opacity="0.6" />
    <line x1="20" y1="0" x2="40" y2="10" stroke="#c72b1a" stroke-width="1.5" opacity="0.6" />
    <line x1="20" y1="20" x2="40" y2="10" stroke="#c72b1a" stroke-width="1.5" opacity="0.6" />
    <line x1="20" y1="0" x2="20" y2="20" stroke="#c72b1a" stroke-width="1.5" opacity="0.4" />
    
    <!-- Pulse Animation on Center Node -->
    <circle cx="20" cy="10" r="2" fill="white" opacity="0.8">
       <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Connecting Line to DB -->
  <path d="M 120 90 Q 130 80 135 65" stroke="#c72b1a" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" fill="none" />

  <!-- Upload Arrow / Action -->
  <path d="M 140 130 L 150 120 L 160 130" stroke="#c72b1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
     <animate attributeName="d" values="M 140 130 L 150 120 L 160 130; M 140 125 L 150 115 L 160 125; M 140 130 L 150 120 L 160 130" dur="2s" repeatCount="indefinite" />
  </path>
</svg>